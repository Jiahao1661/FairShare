{% extends "base.html" %}
{% block title %}Register | FairShare{% endblock %}
{% block content %}
    <div class="
    mx-auto max-w-md rounded-3xl border border-white/10 bg-white/[0.04] p-8
    shadow-2xl backdrop-blur
">
        <h1 class="text-3xl font-semibold">Create account</h1>
        <p class="mt-2 text-gray-400">Start managing household expenses.</p>
        <form method="POST" class="mt-8 space-y-5">
            <div>
                <label class="mb-2 block text-sm text-gray-300">Username</label>
                <input name="username"
                       required
                       value="{{ request.form.get('username', '') }}"
                       class="
    w-full rounded-xl border border-gray-700 bg-black/40 px-4 py-3 outline-none
    focus:border-pink-300
">
            </div>
            <div>
                <label class="mb-2 block text-sm text-gray-300">Email</label>
                <input type="email"
                       name="email"
                       required
                       value="{{ request.form.get('email', '') }}"
                       class="
    w-full rounded-xl border border-gray-700 bg-black/40 px-4 py-3 outline-none
    focus:border-pink-300
">
            </div>
            <div>
                <label class="mb-2 block text-sm text-gray-300">Password</label>
                <input type="password"
                       name="password"
                       required
                       minlength="6"
                       class="
    w-full rounded-xl border border-gray-700 bg-black/40 px-4 py-3 outline-none
    focus:border-purple-400
">
            </div>
            <div>
                <label class="mb-2 block text-sm text-gray-300">Confirm password</label>
                <input type="password"
                       name="confirm_password"
                       required
                       minlength="6"
                       class="
    w-full rounded-xl border border-gray-700 bg-black/40 px-4 py-3 outline-none
    focus:border-purple-400
">
            </div>
            <button class="
    w-full rounded-xl bg-gradient-to-r from-pink-300 to-violet-400 py-3
    font-semibold text-black
">Create Account</button>
        </form>
        <p class="mt-6 text-center text-gray-400">Already registered? <a class="text-pink-300" href="{{ url_for('login') }}">Login</a></p>
    </div>
{% endblock %}
