{% extends "base.html" %}
{% block title %}Edit Housemate | FairShare{% endblock %}
{% block content %}
    <div class="mx-auto max-w-lg rounded-3xl border border-white/10 bg-white/[0.04] p-8">
        <p class="text-pink-300">{{ house['house_name'] }}</p>
        <h1 class="mt-1 text-3xl font-semibold">Edit Housemate</h1>
        <form method="POST" class="mt-7 space-y-5">
            <div>
                <label class="mb-2 block text-sm text-gray-300">Name</label>
                <input name="name"
                       value="{{ housemate['name'] }}"
                       required
                       class="w-full rounded-xl border border-gray-700 bg-black/40 px-4 py-3">
            </div>
            <div>
                <label class="mb-2 block text-sm text-gray-300">Email</label>
                <input type="email"
                       name="email"
                       maxlength="254"
                       value="{{ housemate['email'] or '' }}"
                       class="w-full rounded-xl border border-gray-700 bg-black/40 px-4 py-3">
            </div>
            <div>
                <label class="mb-2 block text-sm text-gray-300">Phone Number</label>
                <input type="tel"
                       name="phone"
                       minlength="7"
                       maxlength="20"
                       pattern="\+?[0-9][0-9 ()-]{6,19}"
                       title="Use 7 to 20 characters: numbers, spaces, +, - or parentheses."
                       value="{{ housemate['phone'] or '' }}"
                       placeholder="Example: 012-3456789"
                       class="w-full rounded-xl border border-gray-700 bg-black/40 px-4 py-3">
            </div>
            <div class="flex gap-3">
                <button class="flex-1 rounded-xl bg-pink-300 py-3 font-semibold text-black">Save</button>
                <a href="{{ url_for('manage_housemates', house_id=house['id']) }}"
                   class="rounded-xl border border-white/20 px-5 py-3">Cancel</a>
            </div>
        </form>
    </div>
{% endblock %}
