{% extends "base.html" %}
{% block title %}Create House | FairShare{% endblock %}
{% block content %}
    <div class="mx-auto max-w-lg rounded-3xl border border-white/10 bg-white/[0.04] p-8 shadow-2xl">
        <div class="text-center">
            <div id="emoji-preview"
                 class="
    mx-auto flex h-20 w-20 items-center justify-center rounded-3xl
    bg-pink-300/10 text-5xl
">🏠</div>
            <h1 class="mt-5 text-3xl font-semibold">Create House</h1>
            <p class="mt-2 text-gray-400">Give your shared home a name, colour and optional avatar image.</p>
        </div>
        <form method="POST" enctype="multipart/form-data" class="mt-7 space-y-5">
            <div>
                <label class="mb-2 block text-sm text-gray-300">Theme colour</label>
                <select name="house_color"
                        class="w-full rounded-xl border border-gray-700 bg-black px-4 py-3">
                    <option value="cyan">Cyan</option>
                    <option value="purple">Purple</option>
                    <option value="green">Green</option>
                    <option value="pink">Pink</option>
                    <option value="orange">Orange</option>
                </select>
            </div>
            <div>
                <label class="mb-2 block text-sm text-gray-300">House name</label>
                <input name="house_name"
                       required
                       placeholder="Example: Mutiara Residence"
                       class="w-full rounded-xl border border-gray-700 bg-black/40 px-4 py-3">
            </div>
            <div>
                <label class="mb-2 block text-sm text-gray-300">House image (optional)</label>
                <input
                    type="file"
                    name="house_image"
                    accept=".png,.jpg,.jpeg,.webp"
                    class="w-full rounded-xl border border-gray-700 bg-black/40 px-4 py-3 text-sm text-gray-300 file:mr-4 file:rounded-lg file:border-0 file:bg-pink-300 file:px-4 file:py-2 file:font-medium file:text-black"
                >
                <p class="mt-2 text-xs text-gray-500">PNG, JPG, JPEG or WEBP. Maximum 5 MB.</p>
            </div>
            <button class="
    w-full rounded-xl bg-gradient-to-r from-pink-300 to-violet-400 py-3
    font-semibold text-black
">Create House</button>
        </form>
    </div>

{% endblock %}
